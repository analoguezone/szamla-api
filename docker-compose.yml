version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: szamla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: szamla_api
      POSTGRES_USER: szamla
      POSTGRES_PASSWORD: dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U szamla']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: szamla-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # API (optional - run locally for development)
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: szamla-api
  #   restart: unless-stopped
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://szamla:dev_password@postgres:5432/szamla_api
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: szamla-network
